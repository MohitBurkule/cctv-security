[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cctv-security"
version = "0.1.0"
description = "CCTV security analytics (evaluation, baselines, experiments) built on the survsim simulator"
requires-python = ">=3.10"
dependencies = [
  "survsim @ git+https://github.com/MohitBurkule/cctv-security-simulation.git",
  "numpy", "scipy", "pandas", "pyarrow", "pydantic>=2", "pyyaml",
  "opencv-python-headless", "pillow", "imageio", "imageio-ffmpeg",
  "matplotlib", "shapely", "networkx", "tqdm", "rich", "typer",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "ruff", "scikit-learn"]
unreal = ["unrealcv", "gymnasium"]

[project.scripts]
cctvsec = "cctvsec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["cctvsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: >10 s; excluded by default, run with `pytest -m slow`"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# typer's idiomatic API requires typer.Option(...) as an argument default.
"cctvsec/cli.py" = ["B008"]
