runner: detection
hypothesis: >
  H7 (mixing ratio). With 60 real MOT20-01 frames fixed, adding 100 / 300 /
  1000 synthetic frames changes real MOT20-02 AP monotonically, and the
  PeopleSansPeople recipe - synthetic pre-training, then real fine-tuning -
  beats naive mixing at the same data.
seed: 0
base_model: yolov8n.pt   # repo root (gitignored; ultralytics downloads it if absent)
batch_dir: out/batch_v6
mot20_root: ~/data/mot/extracted/MOT20
mot20_manifest: $SURVSIM_MOT20_SUBSET/manifest.json
height_bands: [[0, 80], [80, 120], [120, 160], [160, 240], [240, 1000000000]]
synthetic_train_runs: [disguise_and_tamper_day, disguise_and_tamper_night, street_crowd_day,
                       street_crowd_night, street_crowd_far_day]
synthetic_val_runs: [smoke_mock_day, smoke_mock_night]
val_sources: [{source: raw, stride: 20, phase: 0}, {source: degraded, stride: 20, phase: 10}]
# 6 epochs (not H1's 12) to fit the 25-min GPU budget on a GPU shared with the editor;
# every arm here uses the same schedule, so H7 is internally comparable only.
train: {epochs: 6, imgsz: 640, batch: 8, seed: 0, workers: 2}
eval_sets: {mot20_02: [MOT20-02]}
leaky_sets: []
eval_imgsz: [640]
arms:
  - {name: mix_0, seed: 0, description: real 60 x5 only, train: {real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: mix_100, seed: 0, description: real 60 x5 + 100 synthetic, train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 100, real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: mix_300, seed: 0, description: real 60 x5 + 300 synthetic, train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 300, real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: mix_1000, seed: 0, description: real 60 x5 + 1000 synthetic, train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 1000, real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: pretrain1000_then_real, seed: 0, description: 6 ep on 1000 synthetic then 6 ep on real 60 x5, pretrain: {train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 1000}}, train: {real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: mix_0_s1, seed: 1, description: real 60 x5 only, train: {real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: mix_100_s1, seed: 1, description: real 60 x5 + 100 synthetic, train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 100, real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: mix_300_s1, seed: 1, description: real 60 x5 + 300 synthetic, train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 300, real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: mix_1000_s1, seed: 1, description: real 60 x5 + 1000 synthetic, train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 1000, real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
  - {name: pretrain1000_then_real_s1, seed: 1, description: 6 ep on 1000 synthetic then 6 ep on real 60 x5, pretrain: {train: {synthetic: [{source: raw, stride: 8, phase: 0}, {source: degraded, stride: 8, phase: 4}], synthetic_limit: 1000}}, train: {real: {sequence: MOT20-01, frames: 60, repeat: 5}}}
