runner: far_field_h3c
hypothesis: >
  H3c (tiling arms, CC0). On CC0 batch_v8 far cameras, H3's exact tiling arm (320x240 tiles,
  2.0x native, 20 % overlap, full frame at 640 + tiles, NMS 0.5) beats full_1280 by >= 0.05 recall
  on >= 20 px rows (CI excludes 0). A 1.5x arm (427x320 tiles) is reported alongside. Hard
  negative: near-camera AP50 must not drop by > 0.05. Pre-registered in docs/research/32 §H3c.
seed: 0
model: yolov8n.pt
batch_dir: out/batch_v8
require_commercial_ml_ok: true
sources:
  - {source: raw, runs: [street_crowd_far_day, street_crowd_far_night]}
  - {source: degraded, runs: [street_crowd_far_day]}
groups: {far: [cam_02, cam_03], near: [cam_01]}
stride: 3
max_frames_per_stream: null
min_gt_height: 13
bands: [[13, 20], [20, 40], [40, 80], [80, 1000000000]]
primary_min_px: 20      # principle 5: rows >= 20 px are the primary outcome
det_conf: 0.01
op_conf: 0.25
iou: 0.5
block: 30               # sampled frames per bootstrap block (AUDIT_H3B)
n_boot: 1000
decision_margin: 0.05
hn_max_ap50_drop: 0.05
methods:                # first arm is the base for every delta
  - {name: full_1280, imgsz: 1280}
  - {name: tiles_2p0x_320x240, imgsz: 640, tile: [320, 240], overlap: 0.2, tile_imgsz: 640, nms_iou: 0.5}
  - {name: tiles_1p5x_427x320, imgsz: 640, tile: [427, 320], overlap: 0.2, tile_imgsz: 640, nms_iou: 0.5}
h3_reference: {full_1280: 0.405, sahi_320x240: 0.629}
