runner: far_field_cc0
hypothesis: >
  H3b (far-field, CC0). Replicates H3 on the CC0 batch_v8 set: zero-shot YOLOv8n at imgsz 640
  misses most far-camera people under 20 px; imgsz 1280 and 2x2 tiling recover a large part of
  that gap at a latency cost; on the near camera tiling must NOT improve recall (hard negative).
  Pre-registered in docs/research/32 §H3b.
seed: 0
model: yolov8n.pt
batch_dir: out/batch_v8
require_commercial_ml_ok: true
sources:
  - {source: raw, runs: [street_crowd_far_day, street_crowd_far_night]}
  - {source: degraded, runs: [street_crowd_far_day]}
groups: {far: [cam_02, cam_03], near: [cam_01]}
stride: 3
max_frames_per_stream: null   # set to reduce frame count (labelled partial)
min_gt_height: 13
bands: [[13, 20], [20, 40], [40, 80], [80, 1000000000]]
det_conf: 0.01
op_conf: 0.25
iou: 0.5
block: 10          # sampled frames per bootstrap block (within one camera/source stream)
n_boot: 1000
methods:
  - {name: full_640, imgsz: 640}
  - {name: full_1280, imgsz: 1280}
  - {name: tiled_2x2, imgsz: 640, tile: [704, 396], overlap: 0.1, tile_imgsz: 640}
# H3 (batch_v6, MetaHuman, engineering-only) for side-by-side comparison, docs/32 §H3
h3_reference: {full_640: 0.021, full_1280: 0.405, sahi_320x240: 0.629, sahi_512x384: 0.543}
