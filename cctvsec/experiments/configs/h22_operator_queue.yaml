hypothesis: 'H22 (docs/research/66): at A1''s 2.9 FA/cam-h over 40 cameras, a simulated operator (30 s review,
  fatigue after 2 h of a shift, bulk-acknowledge when the queue exceeds N) realises < 0.6 of the model recall
  (0.825) within 5 min when alarms are reviewed FIFO.'
workers: 6
arms: [A1, dwell_25, twin_floor]
