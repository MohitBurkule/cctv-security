hypothesis: 'H61 (docs/research/66, 32 AUDIT_H52): is H52''s masked-background gain
  real background content or a box-shaped inpainting artefact? sil300 removes the
  same 300 batch_v8 people by their rendered silhouette mask (survsim/gt/mask_boxes.py),
  filled with the frame''s background median colour -- no inpainting, no box shape,
  no boxes -- at the H51 recipe (450 steps, 225 warm-up, close_mosaic 0), 10 paired
  seeds reusing dose0 (real-only) and dose300 (true labels) byte-identical from H51/H52.
  Primary contrasts, Holm over 2: dose300 - sil300 (a - c''); sil300 - dose0 (c''
  - real). Rule: background-real iff (c'') - real >= +0.003 with CI excluding 0 and
  Holm p < 0.05; box-fill-artefact iff (c'') approx real.'
